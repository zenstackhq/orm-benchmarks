# A local PostgreSQL, and a toxiproxy in front of it for runs with network latency.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:bench@localhost:5432/bench        # direct
#   DATABASE_URL=postgresql://postgres:bench@localhost:15432/bench       # through the proxy
#   ./scripts/latency.sh 20                                             # add 20 ms to each response
#
# pg_dump and pg_restore on the host must match the server's major version.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bench']
      interval: 2s
      timeout: 2s
      retries: 20

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - '8474:8474'
      - '15432:15432'
    depends_on:
      postgres:
        condition: service_healthy
